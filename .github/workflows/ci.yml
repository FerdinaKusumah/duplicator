name: Django Duplicator CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ develop ]

jobs:
  test:
    name: Py ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Django 6.x needs Python 3.12 or newer
        include:
          - { python: "3.10", django: "4.2" }
          - { python: "3.10", django: "5.2" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.12", django: "6.0" }
          - { python: "3.12", django: "6.1" }
          - { python: "3.13", django: "6.1" }
          - { python: "3.14", django: "6.1" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        # Poetry runs on the runner's Python; only the project uses the matrix one.
        run: pipx install poetry==1.8.4

      - name: Install dependencies
        run: |
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry install --no-root
          poetry run pip install "Django~=${{ matrix.django }}.0"

      - name: ⚙️ Run Black Linter Check
        run: poetry run black --check .

      - name: 🧪 Run Unit Tests
        run: make test
